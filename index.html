<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="stylesheet" href="assets/style.css?v=20261020d">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📒 Company Log</h1>
    <span class="meta" id="updated"></span>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="종목명 또는 코드 검색" autocomplete="off">
    <div class="seg" id="dirSeg">
      <button data-v="all" class="on">전체</button>
      <button data-v="up">최근 상향</button>
      <button data-v="down">최근 하향</button>
    </div>
  </div>

  <div class="panel">
    <ul class="list" id="list"></ul>
  </div>
</div>

<script>
const fmt = n => n == null ? '-' : n.toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let stocks = [], dir = 'all';

// AI 정리 상태: 날짜 / 대기
function aiTxt(s) {
  const a = s.ai;
  if (!a) return '';
  if (a.queued) return '<span class="ai-st">AI 정리 대기</span>';
  const p = a.pending ? ` · ${a.pending}건 대기` : (a.summary_pending ? ' · 의견 갱신 대기' : '');
  return `<span class="ai-st">AI 정리 ${esc((a.date || '').slice(5, 10))}${p}</span>`;
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const rows = stocks.filter(s =>
    (dir === 'all' || s.last_dir === dir) &&
    (!q || s.name.toLowerCase().includes(q) || s.code.includes(q)));
  document.getElementById('list').innerHTML = rows.length ? rows.map(s => `
    <li><a href="stock.html?code=${s.code}">
      <span class="nm">${esc(s.name)}<small>${s.code}</small></span>
      <span class="cnt">리포트 ${s.count} · <span class="pos">▲${s.up}</span> <span class="neg">▼${s.down}</span>${aiTxt(s)}</span>
      <span class="last"><span class="tag ${s.last_dir}">${s.last_dir === 'up' ? '상향' : '하향'}</span>
        ${esc(s.last_date)} · ${esc(s.last_broker)} · 목표가 ${fmt(s.last_to)}원</span>
    </a></li>`).join('') : '<li class="empty">검색 결과가 없어요</li>';
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('dirSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  dir = b.dataset.v;
  document.querySelectorAll('#dirSeg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

fetch('data/index.json', {cache: 'no-cache'}).then(r => r.json()).then(d => {
  stocks = d.stocks;
  document.getElementById('updated').textContent = `${stocks.length}종목 · 갱신 ${d.updated}`;
  render();
});
</script>
</body>
</html>
