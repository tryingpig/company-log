<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 종목 목록</a>

  <div class="head">
    <h1 id="name">…</h1><span class="code" id="code"></span>
    <span class="px" id="px"></span><span class="chg" id="chg"></span>
  </div>

  <div class="panel chart-box">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
    <div class="chart-note">최근 3개월 일봉 · ▲ 목표가 상향 / ▼ 하향 리포트 · ⚠ 증권사 의견 전환 (마커를 누르면 해당 리포트로 이동)</div>
  </div>

  <h2 class="sec">통합 정리 <span class="sub" id="consSub"></span></h2>
  <div class="panel pad" id="consensus"></div>

  <h2 class="sec">증권사별 의견 <span class="sub" id="brkSub"></span></h2>
  <div class="panel" id="brokers"></div>

  <h2 class="sec">증권사 리포트 로그 <span class="sub" id="repCount"></span>
    <div class="seg" id="dirSeg">
      <button data-v="all" class="on">전체</button>
      <button data-v="up">상향</button>
      <button data-v="down">하향</button>
    </div>
  </h2>
  <div class="log" id="log"></div>
</div>

<script>
const fmt = n => n == null ? '-' : n.toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const code = new URLSearchParams(location.search).get('code');
const MAS = [[5, '--ma5'], [10, '--ma10'], [20, '--ma20']];
let data, analysis = null, chart, candle, maSeries = [], dir = 'all';

function sma(bars, n) {
  const out = [];
  let sum = 0;
  bars.forEach((b, i) => {
    sum += b.c;
    if (i >= n) sum -= bars[i - n].c;
    if (i >= n - 1) out.push({time: b.d, value: Math.round(sum / n)});
  });
  return out;
}

function threeMonthsBefore(iso) {
  const d = new Date(iso + 'T00:00:00');
  d.setMonth(d.getMonth() - 3);
  return d.toISOString().slice(0, 10);
}

/* ── 차트 ── */
function drawChart() {
  const el = document.getElementById('chart');
  const bars = data.prices;
  if (!bars.length) { el.innerHTML = '<div class="empty">주가 데이터가 없어요</div>'; return; }
  const from = threeMonthsBefore(bars[bars.length - 1].d);
  const vis = bars.filter(b => b.d >= from);

  chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: {background: {color: 'transparent'}, textColor: css('--text-2'), fontSize: 12},
    grid: {vertLines: {visible: false}, horzLines: {color: css('--line')}},
    rightPriceScale: {borderVisible: false},
    timeScale: {borderVisible: false, fixLeftEdge: true, fixRightEdge: true},
    crosshair: {mode: LightweightCharts.CrosshairMode.Normal},
    localization: {priceFormatter: p => Math.round(p).toLocaleString('ko-KR')},
  });
  candle = chart.addCandlestickSeries({
    upColor: css('--up'), downColor: css('--down'), borderVisible: false,
    wickUpColor: css('--up'), wickDownColor: css('--down'), priceLineVisible: false,
  });
  candle.setData(vis.map(b => ({time: b.d, open: b.o, high: b.h, low: b.l, close: b.c})));

  // 이동평균은 전체 일봉으로 계산하고 3개월 구간만 표시
  maSeries = MAS.map(([n, v]) => {
    const s = chart.addLineSeries({color: css(v), lineWidth: 2, priceLineVisible: false,
                                   lastValueVisible: false, crosshairMarkerVisible: false});
    s.setData(sma(bars, n).filter(p => p.time >= from));
    return s;
  });

  // 리포트 마커: 장 없는 날(주말·휴일)에 나온 리포트는 다음 거래일에 표시
  const days = vis.map(b => b.d);
  const byDay = {};
  data.reports.forEach(r => {
    const d = r.date.slice(0, 10);
    const t = days.find(x => x >= d);
    if (!t || d < from) return;
    (byDay[t] ||= []).push(r);
  });
  const markers = [];
  Object.entries(byDay).forEach(([t, rs]) => {
    ['up', 'down'].forEach(k => {
      const g = rs.filter(r => r.dir === k);
      if (!g.length) return;
      markers.push({
        time: t, id: String(g[0].id),
        position: k === 'up' ? 'belowBar' : 'aboveBar',
        shape: k === 'up' ? 'arrowUp' : 'arrowDown',
        color: css(k === 'up' ? '--up' : '--down'),
        // 의견 전환 리포트가 섞인 날은 ⚠ 로 표시
        text: (g.some(r => r.flip) ? '⚠' : '') + (g.length > 1 ? String(g.length) : ''),
      });
    });
  });
  markers.sort((a, b) => a.time < b.time ? -1 : 1);
  candle.setMarkers(markers);
  chart.timeScale().fitContent();

  chart.subscribeCrosshairMove(p => updateLegend(p.time ? p : null));
  chart.subscribeClick(p => {
    if (p.hoveredObjectId) focusCard(p.hoveredObjectId);
  });
  updateLegend(null);
}

function updateLegend(p) {
  const bars = data.prices;
  let bar, mas;
  if (p) {
    const c = p.seriesData.get(candle);
    bar = c && {d: p.time, o: c.open, h: c.high, l: c.low, c: c.close};
    mas = maSeries.map(s => p.seriesData.get(s)?.value);
  } else {
    bar = bars[bars.length - 1];
    mas = MAS.map(([n]) => { const a = sma(bars, n); return a[a.length - 1]?.value; });
  }
  if (!bar) return;
  document.getElementById('legend').innerHTML =
    `<span class="date">${bar.d}</span><span>종가 ${fmt(bar.c)}</span>` +
    MAS.map(([n, v], i) => `<span><span class="sw" style="background:var(${v})"></span>${n}일 ${fmt(mas[i])}</span>`).join('');
}

/* ── 통합 정리 ── */
const pctTxt = g => g == null ? '-' : `${g > 0 ? '+' : ''}${g.toFixed(1)}%`;
const pctCls = g => g == null ? '' : g >= 0 ? 'pos' : 'neg';
const dirName = d => d === 'up' ? '상향' : '하향';
function fmtVal(v, unit) {
  const n = Math.abs(v) >= 100 ? Math.round(v).toLocaleString('ko-KR') : (+v.toFixed(2)).toLocaleString('ko-KR');
  return n + (unit || '');
}
const bullets = (arr, cls = '') => arr && arr.length ? `<ul class="bul ${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';

function rangeStrip(c) {
  const close = data.close;
  const recent = data.brokers.filter(b => b.target);
  const vals = recent.map(b => b.target).concat(close ? [close] : []);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const pos = v => (v - lo) / span * 100;
  const x = v => pos(v).toFixed(2) + '%';
  // 가장자리 라벨은 안쪽으로 붙여 잘리지 않게
  const edge = v => pos(v) < 15 ? ' class="l"' : pos(v) > 85 ? ' class="r"' : '';
  const dots = recent.map(b => `<span class="dot ${b.last_dir}" style="left:${x(b.target)}"
      data-tip="${esc(b.broker)} ${fmt(b.target)}원 (${pctTxt(b.gap)})"></span>`).join('');
  return `<div class="strip" aria-label="증권사별 최신 목표가 분포">
      <div class="track"></div>${dots}
      ${close ? `<span class="now" style="left:${x(close)}"><em${edge(close)}>현재가 ${fmt(close)}</em></span>` : ''}
      <span class="avg" style="left:${x(c.mean)}"><em${edge(c.mean)}>평균 ${fmt(c.mean)}</em></span>
    </div>
    <div class="strip-axis"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div>`;
}

function renderConsensus() {
  const c = data.consensus, el = document.getElementById('consensus');
  if (!c) { el.innerHTML = '<div class="empty">최근 6개월 안의 목표가가 없어요</div>'; return; }
  document.getElementById('consSub').textContent =
    `최근 6개월 · ${c.n}개 증권사 최신 목표가 기준 · 현재가 ${data.close_date || ''}`;
  let html = `<div class="stats">
      <div><span class="k">현재가</span><b>${fmt(data.close)}원</b></div>
      <div><span class="k">목표가 평균</span><b>${fmt(c.mean)}원</b><span class="${pctCls(c.gap_mean)}">괴리 ${pctTxt(c.gap_mean)}</span></div>
      <div><span class="k">중앙값</span><b>${fmt(c.median)}원</b><span class="${pctCls(c.gap_median)}">괴리 ${pctTxt(c.gap_median)}</span></div>
      <div><span class="k">범위</span><b>${fmt(c.min)} ~ ${fmt(c.max)}</b></div>
      <div><span class="k">최근 방향</span><b><span class="pos">▲${c.up}</span> <span class="neg">▼${c.n - c.up}</span></b></div>
    </div>${rangeStrip(c)}`;

  const a = analysis;
  if (a) {
    if (a.overall?.numbers?.length) html += `<h3 class="h3">핵심 숫자</h3>${bullets(a.overall.numbers, 'num')}`;
    if (a.table?.length) html += `<h3 class="h3">증권사 추정치 비교 <span class="sub">증권사별 가장 최근 값 · 2개사 이상 언급 항목 · 금액은 억원 환산 · ⚠ 원문 단위 확인 필요(평균 제외)</span></h3>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>항목</th><th>기간</th><th class="r">평균</th><th class="r">범위</th><th>증권사별</th></tr></thead>
        <tbody>${a.table.map(t => `<tr>
          <td>${esc(t.item)}</td><td>${esc(t.period)}</td>
          <td class="r">${t.mean == null ? '<span class="odd-txt">단위 불일치</span>' : `<b>${fmtVal(t.mean, t.unit)}</b>`}</td>
          <td class="r">${t.mean == null ? '-' : t.min === t.max ? fmtVal(t.min, t.unit) : `${fmtVal(t.min, '')} ~ ${fmtVal(t.max, t.unit)}`}</td>
          <td class="chips">${t.brokers.map(b => `<a href="#r${b.id}" data-id="${b.id}"${b.odd ? ' class="odd" title="다른 증권사와 5배 이상 차이 — 원문 요약의 단위 표기를 확인하세요(평균에서 제외)"' : ''}>${b.odd ? '⚠ ' : ''}${esc(b.broker)} <b>${fmtVal(b.value, '')}</b></a>`).join('')}</td>
        </tr>`).join('')}</tbody></table></div>`;
    if (a.overall?.view?.length) html += `<h3 class="h3">통합 의견</h3>${bullets(a.overall.view)}`;
    html += `<div class="ai-note">숫자·의견 정리는 아래 리포트 로그 원문에서 AI가 추출 (${esc(a.generated)}). 숫자는 원문 구절과 대조해 확인된 것만 표시</div>`;
  } else {
    html += `<div class="ai-note">증권사 추정치·의견 AI 정리는 아직 준비 중이에요</div>`;
  }
  el.innerHTML = html;
}

/* ── 증권사별 ── */
function renderBrokers() {
  const el = document.getElementById('brokers');
  const flipsTotal = data.brokers.reduce((s, b) => s + b.flips.length, 0);
  document.getElementById('brkSub').textContent =
    `${data.brokers.length}곳 · 최근 리포트순${flipsTotal ? ` · 의견 전환 ${flipsTotal}건` : ''}`;
  el.innerHTML = data.brokers.map(b => {
    const ai = analysis?.brokers?.[b.broker];
    const flips = b.flips.map(id => {
      const r = data.reports.find(x => x.id === id);
      const note = analysis?.flips?.[id];
      return `<div class="flip"><span class="imp">⚠ 의견 전환</span>
        <a href="#r${id}" data-id="${id}">${r.date.slice(0, 10)} ${dirName(r.prev_dir)} → ${dirName(r.dir)} · 목표가 ${fmt(r.from)} → ${fmt(r.to)}</a>
        ${note ? `<div class="flip-note">${esc(note)}</div>` : ''}</div>`;
    }).join('');
    return `<details class="brk${b.flips.length ? ' has-flip' : ''}">
      <summary>
        <span class="bn">${esc(b.broker)}${b.flips.length ? ' <span class="imp sm">⚠ 전환</span>' : ''}</span>
        <span class="bt"><b>${fmt(b.target)}원</b> <span class="${pctCls(b.gap)}">${pctTxt(b.gap)}</span></span>
        <span class="bm"><span class="tag ${b.last_dir}">${dirName(b.last_dir)}</span> ${esc(b.opinion)} · ${b.last_date.slice(0, 10)} · ${b.count}건</span>
      </summary>
      <div class="brk-body">
        ${flips}
        ${ai ? `${ai.numbers.length ? `<div class="lbl2">숫자</div>${bullets(ai.numbers, 'num')}` : ''}
                ${ai.view.length ? `<div class="lbl2">의견</div>${bullets(ai.view)}` : ''}`
             : '<div class="ai-note">AI 정리 준비 중</div>'}
        <div class="hist">${data.reports.filter(r => r.broker === b.broker).map(r =>
          `<a href="#r${r.id}" data-id="${r.id}"><span class="tag ${r.dir}">${dirName(r.dir)}</span> ${r.date.slice(0, 10)} · ${r.from ? fmt(r.from) + ' → ' : ''}${fmt(r.to)}</a>`).join('')}</div>
      </div>
    </details>`;
  }).join('');
}

// 요약 영역의 리포트 링크는 해당 카드로 이동 + 강조
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-id]');
  if (!a) return;
  e.preventDefault();
  focusCard(a.dataset.id);
});

/* ── 로그 ── */
function card(r) {
  const up = r.dir === 'up';
  const flip = r.flip ? `<div class="flip in-card"><span class="imp">⚠ 의견 전환</span> ${esc(r.broker)} 직전 ${dirName(r.prev_dir)} → 이번 ${dirName(r.dir)}
      ${analysis?.flips?.[r.id] ? `<div class="flip-note">${esc(analysis.flips[r.id])}</div>` : ''}</div>` : '';
  const pct = r.diff != null && r.from ? ` (${r.diff > 0 ? '+' : ''}${(r.diff / r.from * 100).toFixed(1)}%)` : '';
  const target = r.from != null
    ? `${fmt(r.from)} → <b>${fmt(r.to)}</b>원 <span class="${up ? 'pos' : 'neg'}">${r.diff > 0 ? '▲' : r.diff < 0 ? '▼' : ''}${fmt(Math.abs(r.diff))}${pct}</span>`
    : `<b>${fmt(r.to)}</b>원 <span style="color:var(--muted)">(이전값 없음)</span>`;
  return `<article class="panel card${r.flip ? ' is-flip' : ''}" id="r${r.id}">
    ${flip}
    <div class="row1"><span class="tag ${r.dir}">${up ? '▲ 상향' : '▼ 하향'}</span>
      <span>${esc(r.date)}</span><span>·</span><span class="broker">${esc(r.broker)}</span></div>
    <div class="title">${esc(r.title)}</div>
    <div class="nums">
      <span><span class="lbl">목표주가</span>${target}</span>
      <span><span class="lbl">투자의견</span>${esc(r.opinion)}</span>
    </div>
    ${r.summary ? `<div class="sum">${esc(r.summary)}</div>` : ''}
  </article>`;
}

function renderLog() {
  const rs = data.reports.filter(r => dir === 'all' || r.dir === dir);
  document.getElementById('log').innerHTML = rs.length ? rs.map(card).join('') : '<div class="panel empty">해당 리포트가 없어요</div>';
}

function focusCard(id) {
  if (dir !== 'all') document.querySelector('#dirSeg button[data-v="all"]').click();
  const el = document.getElementById('r' + id);
  if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'start'});
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1600);
}

document.getElementById('dirSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  dir = b.dataset.v;
  document.querySelectorAll('#dirSeg button').forEach(x => x.classList.toggle('on', x === b));
  renderLog();
});

function renderHead() {
  document.title = `${data.name} · Company Log`;
  document.getElementById('name').textContent = data.name;
  document.getElementById('code').textContent = data.code;
  const b = data.prices, n = b.length;
  if (n) {
    document.getElementById('px').textContent = fmt(b[n - 1].c) + '원';
    if (n > 1) {
      const d = b[n - 1].c - b[n - 2].c, p = d / b[n - 2].c * 100;
      const el = document.getElementById('chg');
      el.textContent = `${d > 0 ? '▲' : d < 0 ? '▼' : ''}${fmt(Math.abs(d))} (${p > 0 ? '+' : ''}${p.toFixed(2)}%)`;
      el.className = 'chg ' + (d > 0 ? 'pos' : d < 0 ? 'neg' : '');
    }
  }
  const up = data.reports.filter(r => r.dir === 'up').length;
  document.getElementById('repCount').textContent = `${data.reports.length}건 · 상향 ${up} · 하향 ${data.reports.length - up}`;
}

// 테마가 바뀌면 차트 색을 다시 칠한다
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!chart) return;
  chart.remove(); drawChart();
});

if (!code) location.replace('./');
Promise.all([
  fetch(`data/stocks/${code}.json`, {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
  fetch(`data/analysis/${code}.json`, {cache: 'no-cache'}).then(r => r.ok ? r.json() : null).catch(() => null),
])
  .then(([d, a]) => {
    data = d; analysis = a;
    renderHead(); drawChart(); renderConsensus(); renderBrokers(); renderLog();
  })
  .catch(() => { document.getElementById('name').textContent = '종목을 찾을 수 없어요'; });
</script>
</body>
</html>
